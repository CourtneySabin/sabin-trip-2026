<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#e4dfd5; --dim:#f0ece4;
  --travel:#5b5f97; --travel-bg:#e8e9f6;
  --ireland:#2e7d4f; --ireland-bg:#e2f2e8;
  --robion:#b8651b; --robion-bg:#fbeedd;
  --morocco:#b3362f; --morocco-bg:#f9e2df;
  --paris:#2b6cb0; --paris-bg:#e0ecf8;
  --work:#4b5563; --work-bg:#eceef1;
  --guest:#8a4fa3; --guest-bg:#f2e6f7;
  --nanny:#0f7c80; --nanny-bg:#dff3f3;
  --today:#e0a100;
  --navy:#3b3f5e; --tan:#a8683a; --paper:#ffffff; --doodle:#d9d6cf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1f2227; --ink:#eceae6; --muted:#9aa0a8; --line:#2f333a; --dim:#1a1c20;
    --travel:#a9adf0; --travel-bg:#2a2c47;
    --ireland:#7fd3a0; --ireland-bg:#1e3a2a;
    --robion:#f0a860; --robion-bg:#3d2c1a;
    --morocco:#f08a82; --morocco-bg:#40211f;
    --paris:#8cbcf0; --paris-bg:#1d3048;
    --work:#c3c8cf; --work-bg:#2c3036;
    --guest:#d4a3e8; --guest-bg:#34243d;
    --nanny:#6fd6d9; --nanny-bg:#173a3b;
    --navy:#c9cdf0; --tan:#e0a577; --paper:#1f2227; --doodle:#3a3e46;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1f2227; --ink:#eceae6; --muted:#9aa0a8; --line:#2f333a; --dim:#1a1c20;
  --travel:#a9adf0; --travel-bg:#2a2c47;
  --ireland:#7fd3a0; --ireland-bg:#1e3a2a;
  --robion:#f0a860; --robion-bg:#3d2c1a;
  --morocco:#f08a82; --morocco-bg:#40211f;
  --paris:#8cbcf0; --paris-bg:#1d3048;
  --work:#c3c8cf; --work-bg:#2c3036;
  --guest:#d4a3e8; --guest-bg:#34243d;
    --nanny:#6fd6d9; --nanny-bg:#173a3b;
    --navy:#c9cdf0; --tan:#e0a577; --paper:#1f2227; --doodle:#3a3e46;
}
*{box-sizing:border-box}
body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
header{position:relative;text-align:center;padding:10px 0 6px;overflow:hidden}
.script{font-family:Yellowtail,cursive;color:var(--tan);font-size:clamp(44px,9vw,76px);line-height:.8;display:block;transform:rotate(-4deg);position:relative;z-index:1}
header h1{font-family:"Bebas Neue","Oswald","Arial Narrow",sans-serif;font-weight:400;color:var(--navy);font-size:clamp(64px,15vw,132px);line-height:.85;margin:0;letter-spacing:2px}
.doodle{position:absolute;pointer-events:none;color:var(--tan)}
.contour{position:absolute;pointer-events:none;color:var(--doodle)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;max-width:760px;margin:28px auto 8px;text-align:left;font:13px/1.4 Poppins,sans-serif}
.info div{border-bottom:1px solid var(--muted);padding:0 0 5px;color:var(--ink)}
.info b{font-weight:500;color:var(--muted);margin-right:6px}
@media (max-width:600px){.info{grid-template-columns:1fr}.doodle{display:none}}
.route{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;justify-content:center}
.leg{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.3}
.leg small{display:block;font-weight:400;opacity:.85}
.controls{display:flex;gap:8px;margin:8px 0 28px;flex-wrap:wrap;align-items:center;justify-content:center}
.toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 16px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* grid */
.month{margin-bottom:28px}
.month h2{font-family:"Bebas Neue",sans-serif;font-weight:400;color:var(--navy);letter-spacing:1px;font-size:34px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--card);text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:8px 0;text-transform:uppercase}
.cell{background:var(--card);min-height:118px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;position:relative}
.cell.off{background:var(--dim)}
.cell.off .num{opacity:.4}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.num{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.loc{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;width:fit-content}
.item{font-size:11.5px;line-height:1.3}
.chip{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;width:fit-content}
.hol{font-size:10.5px;color:var(--muted);font-style:italic}

.c-travel{color:var(--travel);background:var(--travel-bg)}
.c-ireland{color:var(--ireland);background:var(--ireland-bg)}
.c-robion{color:var(--robion);background:var(--robion-bg)}
.c-morocco{color:var(--morocco);background:var(--morocco-bg)}
.c-paris{color:var(--paris);background:var(--paris-bg)}
.c-work{color:var(--work);background:var(--work-bg)}
.c-guest{color:var(--guest);background:var(--guest-bg)}
.c-nanny{color:var(--nanny);background:var(--nanny-bg)}

/* list — itinerary style */
#list{background:var(--paper);border-radius:18px;padding:40px clamp(16px,4vw,48px);position:relative;overflow:hidden}
.seg{margin-bottom:40px}
.seghead{font-family:Yellowtail,cursive;color:var(--tan);font-size:38px;line-height:1;margin:0 0 2px;display:flex;align-items:center;gap:14px}
.seghead::after{content:"";flex:1;height:1px;background:var(--doodle)}
.segsub{font:12.5px/1.5 Poppins,sans-serif;color:var(--muted);margin-bottom:20px}
.day{display:grid;grid-template-columns:130px 1fr;gap:26px;margin-bottom:26px;align-items:start}
.arch{width:130px;height:168px;border-radius:65px 65px 4px 4px;overflow:hidden;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.arch svg{display:block;width:100%;height:100%}
.arch .badge{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);color:#3b3f5e;text-align:center;font-family:"Bebas Neue","Oswald",sans-serif;font-size:20px;letter-spacing:1px;padding:6px 0 4px;line-height:1}
.arch .badge small{display:block;font:500 9.5px Poppins,sans-serif;letter-spacing:.08em;color:#a8683a;margin-top:1px}
.day.today .arch{box-shadow:0 0 0 3px var(--today)}
.day.today .dh>span::after{content:"Today";font:600 10px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--today);color:#fff;border-radius:4px;padding:3px 6px;margin-left:10px;vertical-align:middle}
.dcontent{padding-top:8px}
.dh{font-family:"Bebas Neue","Oswald",sans-serif;color:var(--navy);font-size:28px;letter-spacing:1px;line-height:1.05;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.wx{display:inline-flex;align-items:center;gap:7px;background:var(--paris-bg);border:1px solid transparent;border-radius:999px;padding:4px 12px 4px 8px;font:600 13px Poppins,sans-serif;color:var(--navy);letter-spacing:0;line-height:1.2;white-space:nowrap}
.wx i{font-style:normal;font-size:17px}
.wx small{font:500 11px Poppins,sans-serif;color:var(--paris)}
.wx.typ{background:transparent;border:1px dashed var(--doodle)}
.wx.typ small{color:var(--muted)}
.dh em{font-style:normal;color:var(--tan)}
.tl{border-left:2px solid var(--tan);margin-left:5px;padding-left:18px;display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:120px 1fr;gap:14px;position:relative}
.row::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--tan);border:2px solid var(--paper)}
.row.drive .lbl,.row.drive .txt{color:var(--muted);font-size:12px}
.row.drive::before{background:var(--paper);border:2px solid var(--tan);width:8px;height:8px;left:-24px}
.lbl{font-family:"Bebas Neue",sans-serif;color:var(--navy);font-size:15px;letter-spacing:.6px;line-height:1.2}
.txt{font:13px/1.5 Poppins,sans-serif;color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips .chip{font-size:11px;font-family:Poppins,sans-serif}
.empty{font:italic 13px Poppins,sans-serif;color:var(--muted)}
@media (max-width:640px){
  .day{grid-template-columns:92px 1fr;gap:14px}
  .arch{width:92px;height:120px;border-radius:46px 46px 4px 4px}
  .arch .badge{font-size:14px}
  .dh{font-size:23px}
  .wx{font-size:12px;padding:3px 10px 3px 7px}.wx small{font-size:10px}
  .dcontent{padding-top:2px}
  .row{grid-template-columns:1fr;gap:0}
  .seghead{font-size:32px}
}
/* things to do / eat */
.extras{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.xcard{background:var(--paper);border-radius:18px;padding:32px clamp(16px,3vw,36px)}
.xcard h2{font-family:Yellowtail,cursive;font-weight:400;color:var(--tan);font-size:40px;line-height:1;margin:0 0 18px;display:flex;align-items:center;gap:14px}
.xcard h2::after{content:"";flex:1;height:1px;background:var(--doodle)}
.xgroup{margin-bottom:22px}
.xgroup:last-child{margin-bottom:0}
.xgroup .loc{font-family:Poppins,sans-serif;margin-bottom:8px}
.xgroup ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--doodle);display:flex;flex-direction:column;gap:6px}
.xgroup li{font:13px/1.45 Poppins,sans-serif;color:var(--ink)}
.xgroup li b{font-weight:600;color:var(--navy)}
.xgroup li span{color:var(--muted)}
.xgroup li.sub{font:600 10.5px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tan);margin-top:8px}
.xgroup li.sub:first-child{margin-top:0}
@media (max-width:800px){.extras{grid-template-columns:1fr}}
.hide{display:none}
footer{color:var(--muted);font-size:12px;margin-top:30px}
@media (max-width:700px){
  .cell{min-height:70px;padding:4px}
  .cell .item,.cell .chip,.cell .hol{display:none}
  .cell .loc{font-size:8.5px;padding:1px 3px}
  .cell .dot{display:flex}
}
.dots{display:none;gap:3px}
@media (max-width:700px){.dots{display:flex}}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="contour" style="right:-30px;top:-20px;width:190px" viewBox="0 0 190 150" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M40 0c10 40 50 60 90 50s60 20 60 50"/><path d="M60 0c8 28 40 45 72 38s58 14 58 40"/><path d="M80 0c6 18 30 30 55 26s55 8 55 28"/><path d="M100 0c5 10 20 18 38 16s52 4 52 16"/></svg>
    <svg class="doodle" style="left:4%;top:4px;width:120px" viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 50c20-4 34 4 30 14s-18 2-10-10 30-26 50-30 26-8 34-18" stroke-dasharray="5 6"/><path d="M96 2l14 4-6 13"/></svg>
    <svg class="doodle" style="left:12%;top:74px;width:34px" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c1 7 3 9 10 10-7 1-9 3-10 10-1-7-3-9-10-10 7-1 9-3 10-10z"/><path d="M24 18c.5 3 1.5 4 4 4.5-2.5.5-3.5 1.5-4 4.5-.5-3-1.5-4-4-4.5 2.5-.5 3.5-1.5 4-4.5z"/></svg>
    <svg class="doodle" style="right:10%;top:120px;width:30px" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c1 7 3 9 10 10-7 1-9 3-10 10-1-7-3-9-10-10 7-1 9-3 10-10z"/><path d="M24 18c.5 3 1.5 4 4 4.5-2.5.5-3.5 1.5-4 4.5-.5-3-1.5-4-4-4.5 2.5-.5 3.5-1.5 4-4.5z"/></svg>
    <span class="script">Sabin</span>
    <h1>Trip 2026</h1>
    <div class="info">
      <div><b>Destination:</b>Ireland · France · Marrakech · Paris</div>
      <div><b>Duration:</b>43 days</div>
      <div><b>Dates:</b>Oct 7 – Nov 18, 2026</div>
      <div><b>Departure:</b>SLC · Wed Oct 7, 10:08 AM</div>
    </div>
  </header>

  <div class="route" id="route"></div>

  <div class="controls">
    <div class="toggle" role="tablist">
      <button id="bList" class="on">List</button>
      <button id="bCal">Calendar</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--work)"></i>Courtney working</span>
      <span><i style="background:var(--guest)"></i>Guests</span>
      <span><i style="background:var(--nanny)"></i>Lucy (nanny)</span>
      <span><i style="background:var(--today)"></i>Today</span>
    </div>
  </div>

  <div id="list"></div>
  <div id="cal" class="hide"></div>

  <div class="extras">
    <section class="xcard"><h2>Things to Do</h2><div id="todo"></div></section>
    <section class="xcard"><h2>Things to Eat</h2><div id="toeat"></div></section>
  </div>

  <footer>Times are local to wherever we are that day.</footer>
</div>

<script>
const LOC = {
  travel:{name:"Travel"}, ireland:{name:"Ireland"}, robion:{name:"Robion"},
  morocco:{name:"Marrakech"}, paris:{name:"Paris"}
};
const days = {};
function d(m,day){return `2026-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`}
function set(m,day,o){const k=d(m,day);days[k]=Object.assign(days[k]||{items:[],guests:[]},o)}
function range(m1,a,m2,b,fn){let dt=new Date(2026,m1-1,a),end=new Date(2026,m2-1,b);while(dt<=end){fn(dt.getMonth()+1,dt.getDate());dt.setDate(dt.getDate()+1)}}

// Locations
set(10,7,{loc:"travel",items:["Delta · 10:08 AM SLC → Minneapolis","2:05 PM Arrive Minneapolis (MSP, est.) · about 4 hr layover","2:30 PM Lunch at MSP airport","Delta 258 · 6:25 PM Minneapolis → Dublin (overnight)"]});
range(10,8,10,11,(m,x)=>set(m,x,{loc:"ireland"}));
days[d(10,8)].items=["7:55 AM Arrive Dublin (Delta 258)","10:00 AM Pick up rental car · Dublin Airport","10:30 AM Drive to Bangor · about 2 hrs, 111 mi (M1/A1 via Newry & Belfast)","1:00 PM Check in · Airbnb, 13 Hamilton Road, Bangor"];
set(10,12,{loc:"travel",hol:"Columbus Day",items:["Check out of Bangor Airbnb","Return rental car · Dublin Airport (booked 10:00 AM)","Ryanair FR1984 · 7:25 AM Dublin → 10:45 AM Carcassonne","11:00 AM Pick up minivan · Alamo, Carcassonne Airport (Peugeot 5008, 7 seats, one-way)","Drive · Carcassonne → Avignon · about 2 hr 30 min, 150 mi (A61/A9) · lunch on the way","3:00 PM Drop off minivan · Alamo, Chemin de Gigognan, Avignon","3:00 PM Pick up 2 rental cars · Europcar, Avignon TGV station (Place de l'Europe) · Compact, automatic (Courtney) + Economy, manual (Grayson)","Drive · Avignon TGV → Robion · about 30 min"]});
range(10,13,11,8,(m,x)=>set(m,x,{loc:"robion"}));
set(11,9,{loc:"travel",items:["10:00 AM Return both rental cars · Europcar, Avignon TGV (booked for 12 PM, drop off early for the train)","10:48 AM Frecciarossa train (booked, Rail Europe) · Avignon TGV → Lyon-St Exupéry TGV, direct · arrive 11:40 AM","11:40 AM Lunch + wait at Lyon airport · bag drop opens 2:50 PM","easyJet EJU4479 · 5:20 PM Lyon (T1) → 7:30 PM Marrakech","Bag drop 2:50–4:20 PM","Check in: Delta Hotels Marrakech Eden Andalou"]});
range(11,10,11,13,(m,x)=>set(m,x,{loc:"morocco"}));
set(11,14,{loc:"travel",items:["Check out of hotel early","Bag drop 4:00–6:00 AM","easyJet EJU6005 · 7:00 AM Marrakech → 11:30 AM Paris CDG (T2D)","Check in · Paris Airbnb"]});
range(11,15,11,17,(m,x)=>set(m,x,{loc:"paris"}));
set(11,18,{loc:"travel",items:["Check out of Paris Airbnb","JetBlue 1408 · 11:20 AM Paris CDG (T2B) → 2:07 PM JFK","JetBlue 71 · 6:30 PM JFK (T5) → 9:54 PM SLC"]});

// Work
[8,9].forEach(x=>set(10,x,{work:"2–10"}));
[13,14,15,16,19,20,21,22,23,26,27,28,29,30].forEach(x=>set(10,x,{work:"4–12"}));
[2,3,4,5,6].forEach(x=>set(11,x,{work:"3–11"}));
[11,12,13].forEach(x=>set(11,x,{work:"Work"}));

// Guests
range(10,15,10,23,(m,x)=>days[d(m,x)].guests.push("Steve & Emily"));
range(10,19,10,22,(m,x)=>days[d(m,x)].guests.push("Jevohn & Kaylin"));
range(10,23,10,28,(m,x)=>days[d(m,x)].guests.push("Debbie & Gary"));
days[d(10,15)].items.push("6 PM Steve & Emily arrive");
days[d(10,23)].items.push("Steve & Emily leave","Debbie & Gary arrive");

// Lucy (nanny)
set(10,8,{lucy:"2–8 PM"}); set(10,9,{lucy:"2–8 PM"});
range(10,13,11,6,(m,x)=>{const w=new Date(2026,m-1,x).getDay();
  const h=w===1?"4–8 PM":(w>=2&&w<=5)?"7–11 AM · 4–8 PM":w===6?"7–11 AM":null;
  if(h) set(m,x,{lucy:h});});
days[d(11,6)].items.push("Lucy leaves for Paris from Avignon station");

// Ireland plans
Object.assign(days[d(10,9)],{title:"Titanic Belfast"});
days[d(10,9)].items.push("9:15 AM Drive to Titanic Belfast · about 25 min, 13 mi","9:50 AM Titanic Belfast (tickets booked) · 1 Olympic Way, Queen's Rd, Titanic Quarter, BT3 9EP · Debbie, Gary, Lucy, Grayson, Courtney, Zoey, Quinn, Maeve & Maddox","12:15 PM SS Nomadic if time (included with ticket)","12:30 PM Quick lunch, then drive home by 1:15 for Courtney's 2 PM work");
[9,10,11].forEach(x=>days[d(10,x)].guests.push("Debbie & Gary"));
Object.assign(days[d(10,10)],{title:"Causeway Coast"});

// Weather: live forecast (Open-Meteo, up to 16 days out) with typical-weather fallback
const WX_PLACE={slc:[40.76,-111.89],bangor:[54.66,-5.67],robion:[43.85,5.11],marrakech:[31.63,-8.01],paris:[48.86,2.35]};
// typical highs/lows (°F) and chance of a rainy day, mid-Oct and mid-Nov
const WX_NORM={slc:[[66,42,10],[52,32,15]],bangor:[[57,45,55],[51,40,60]],robion:[[70,50,25],[59,40,25]],marrakech:[[81,56,8],[74,49,12]],paris:[[61,47,40],[50,40,45]]};
function wxPlace(k){
  if(k<="2026-10-07") return "slc";
  if(k<="2026-10-11") return "bangor";
  if(k<="2026-11-08") return "robion";
  if(k<="2026-11-13") return "marrakech";
  return "paris";
}
function wxTypical(k){
  const [a,b]=WX_NORM[wxPlace(k)],dt=new Date(k+"T12:00"),t0=new Date("2026-10-15T12:00"),t1=new Date("2026-11-15T12:00");
  const f=Math.min(1,Math.max(0,(dt-t0)/(t1-t0))),m=i=>Math.round(a[i]+(b[i]-a[i])*f);
  return {hi:m(0),lo:m(1),rain:m(2),typ:true};
}
function wxIcon(code,rain){
  if(code==null) return rain<20?"☀️":rain<40?"⛅":"🌦️";
  if(code===0) return "☀️"; if(code<=2) return "🌤️"; if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️"; if(code>=95) return "⛈️";
  if(code>=71&&code<=77||code===85||code===86) return "🌨️";
  if(code>=80) return "🌦️"; if(code>=51) return "🌧️"; return "⛅";
}
function wxPill(k,w){
  return `<span class="wx${w.typ?" typ":""}" id="wx-${k}" title="${w.typ?"Typical weather for this date — the live forecast appears about 2 weeks out":"Forecast"}"><i>${wxIcon(w.code,w.rain)}</i>${w.hi}° / ${w.lo}°<small>· ${w.rain}% rain</small></span>`;
}
function wxLoad(){
  Object.entries(WX_PLACE).forEach(([p,[la,lo]])=>{
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`)
      .then(r=>r.ok?r.json():null).then(j=>{
        if(!j||!j.daily) return;
        j.daily.time.forEach((k,i)=>{
          if(wxPlace(k)!==p) return;
          const el=document.getElementById("wx-"+k); if(!el) return;
          const hi=j.daily.temperature_2m_max[i],lo=j.daily.temperature_2m_min[i];
          if(hi==null||lo==null) return;
          el.outerHTML=wxPill(k,{hi:Math.round(hi),lo:Math.round(lo),rain:j.daily.precipitation_probability_max[i]??0,code:j.daily.weather_code[i]});
        });
      }).catch(()=>{});
  });
}

function parse(t){
  let m=t.match(/^(\d{1,2}(?::\d{2})?(?:\s?(?:AM|PM))?(?:–\d{1,2}(?::\d{2})?)?\s?(?:AM|PM))\s+(.*)$/); if(m) return [m[1],m[2]];
  m=t.match(/^((?:Delta|Ryanair|easyJet|JetBlue)(?: \w+)?) · (.*)$/); if(m) return [m[1],m[2]];
  if(/^BYU /.test(t)) return ["BYU Football",t];
  if(/^Drive · /.test(t)) return ["Drive",t.slice(8)];
  if(/^Train · /.test(t)) return ["Train",t.slice(8)];
  if(/^Check (in|out)/.test(t)) return ["Stay",t];
  if(/rental car/i.test(t)) return ["Car",t];
  if(/^Bag drop/.test(t)) return ["Bags",t];
  return ["Note",t];
}

// Calendar view
function month(m,name){
  let h=`<div class="month"><h2>${name} 2026</h2><div class="grid">`+DOW.map(x=>`<div class="dow">${x}</div>`).join("");
  const first=new Date(2026,m-1,1).getDay(),len=new Date(2026,m,0).getDate();
  for(let i=0;i<first;i++) h+=`<div class="cell off"></div>`;
  for(let x=1;x<=len;x++){
    const k=d(m,x),o=days[k];
    if(!o||!o.loc){h+=`<div class="cell off"><div class="num">${x}</div>${o&&o.hol?`<div class="hol">${o.hol}</div>`:""}</div>`;continue}
    const today=isThisYear&&k===todayKey?" today":"";
    let dots="";
    if(o.work) dots+=`<i style="background:var(--work)"></i>`;
    if(o.guests.length) dots+=`<i style="background:var(--guest)"></i>`;
    if(o.lucy) dots+=`<i style="background:var(--nanny)"></i>`;
    h+=`<div class="cell${today}"><div class="num">${x}<span class="dots">${dots}</span></div><span class="loc c-${o.loc}">${LOC[o.loc].name}</span>`+
      o.items.map(i=>`<div class="item">${esc(i)}</div>`).join("")+chipsFor(o)+(o.hol?`<div class="hol">${o.hol}</div>`:"")+`</div>`;
  }
  const tail=(7-((first+len)%7))%7;
  for(let i=0;i<tail;i++) h+=`<div class="cell off"></div>`;
  return h+`</div></div>`;
}
