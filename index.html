const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,256))}
async function open(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
const KEY="sabinTripKey:"+D.s;
(async()=>{try{const r=localStorage.getItem(KEY);if(r){await open(u(r));}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;b.textContent="Opening…";er.textContent="";
 try{const raw=await derive(document.getElementById("pw").value);await open(raw);try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(_){}}
 catch(x){er.textContent="That password didn't work. Try again.";b.disabled=false;b.textContent="Open"}};
